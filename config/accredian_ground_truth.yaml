# This list is COMPLETE. An institute that is not here is not a partner.
# That is deliberate: an open-world reading ("I cannot verify it, so I will let
# it pass") is exactly what let a fabricated IIM Calcutta partnership through.
#
# A stale list produces false positives on a genuine new partner. That is the
# correct direction to fail — a wrongly flagged call costs one QA review, a
# missed L3 costs a customer. Update this the day a partnership is signed.
#
# canonical    the exact name reps must use
# aliases      acceptable once the canonical name has been used at least once
# short_forms  NOT acceptable on their own (this is the existing L1
#              "incomplete institute name" violation)
# programs     which programs this institute actually backs. A real partner
