ranking_staleness_months: 18    # older than this and it stops being quotable


# =============================================================================
# 4. THE CREDENTIAL
# =============================================================================
# The course CSV says what the credential IS. This says what it is NOT, so an
# equivalence claim finally has something to fail against.
#
# Override `is` per program in the course CSV if the wording differs.
# =============================================================================
credential:
  is: "Post Graduate Certificate Programme — a certificate, not a degree and not a diploma"

  never_equivalent_to:
    ["PGDCA", "PGDM", "PGP", "PGDBM", "MBA", "Executive MBA", "EMBA",
     "M.Tech", "M.S.", "M.Sc", "any Master's degree", "any Bachelor's degree",
     "any degree", "any diploma", "post graduate diploma"]

  never_recognised_by:
    ["UGC", "AICTE", "NAAC", "NBA", "Ministry of Education", "Government of India"]

  never_unlocks:
    ["validity for government jobs", "PSU recruitment eligibility",
     "PhD admission eligibility", "degree equivalence certificate",
     "counting as a qualifying degree for further study"]


# =============================================================================
# 5. INTERPRETATION RULES — how to read the transcript
# =============================================================================
# These change how a line is attributed, before any fact is checked.
# =============================================================================
interpretation_rules:

  - id: affirmation
    rule: >
      A rep owns what they agree to. When the customer states a factual
      proposition — usually as a question — and the rep affirms it, the rep has
      asserted the WHOLE proposition. Judge it exactly as if the rep had spoken
      the customer's sentence themselves. The fact that the rep used one word
      does not make it vague, and it does not make it the customer's claim.
    affirmations:
      ["yes", "yeah", "yep", "ya", "haan", "ji", "ji haan", "bilkul", "exactly",
       "correct", "right", "sahi", "sahi hai", "ekdum", "absolutely",
       "of course", "definitely", "sure", "100%", "true", "that's right",
       "pretty much", "more or less", "kind of"]
    a_hedged_yes_is_still_a_yes: true
    does_not_apply_to: >
      Logistics. "Can I pay next week?" / "Haan, sure" is not a claim. This
      applies when the proposition is about the program, the institute, the
      credential, fees, placement or rankings.
    only_cleared_by: >
      An actual correction. "No, it is a certificate, not a diploma" is a Pass.
    example_violation: |
      CUSTOMER: "And is it equal to a PGDCA?"
      REP:      "Yeah."
      -> the rep has claimed equivalence to a PGDCA.

  - id: attributive_vs_illustrative
    rule: >
      Before flagging a third-party institute, decide intent. ATTRIBUTIVE means
      the rep presents the program as from, certified by, affiliated with or
      offered alongside that institute — flag it. ILLUSTRATIVE means the rep
      uses it as an analogy or benchmark with no claim of a relationship — do
      not flag it.
    test: >
      Would a reasonable customer, hearing this, believe Accredian has a
      relationship with that institute? If yes, it is attributive.
    important_limit: >
      This test resolves attributive vs illustrative ONLY. It does not decide
      whether a partnership exists. Once a mention is attributive, section 2
      decides, and absence from that list means false — however confidently the
      rep spoke.
    example_violation: "For the CFO program we have IIM Calcutta as well."
    example_ok: "Just like an IIT or IIM certification adds credibility, similarly this program..."


# =============================================================================
# 6. CLAIM RULES — what to check, and which checklist item fails
# =============================================================================
# The analyser applies every rule below on every call.
# ADD A NEW CHECK BY COPYING ONE BLOCK. No code, no prompt change.
# =============================================================================
claim_rules:

  - id: non_partner_institute
    when_rep: >
      Names any institute attributively — as provider, certifier, co-brand,
      affiliate, or as another option Accredian offers.
    check_against: "partner_institutes and known_non_partners (section 2)"
    violation_if: >
      The institute is in known_non_partners, OR it is absent from
      partner_institutes. Absence IS the verification — the list is closed.
      Do not reason "I cannot verify this, so I will let it pass."
      If partner_list_verified is false and the institute is merely absent
      (not in known_non_partners), still FAIL it but say NEEDS REVIEW in the
      reason so QA confirms before action is taken.
    fails_checklist_item: "No unlisted or non-partner institute claimed"
    never_fail_both_with: "Institution name correct"
    example_violation: "For the CFO program we have IIM Calcutta and IIM Lucknow as well."
    example_ok: "This program is delivered with XLRI Delhi-NCR."

  - id: wrong_program_for_partner
    when_rep: >
      Attributes a program to a genuine partner that does not back it.
    check_against: "the `programs` list under that institute (section 2)"
    violation_if: >
      The program discussed is not in that institute's `programs`. Skip this
      rule where `programs` is still empty — that is an unfilled config, not a
      finding.
    fails_checklist_item: "No unlisted or non-partner institute claimed"
    example_violation: "XLRI also runs our data science program."
    example_ok: "XLRI Delhi-NCR runs the Strategic HR Leadership program."

  - id: ranking_or_tier_claim
    when_rep: >
      Asserts standing: "top 10", "top 5", "one of the best", "#1", "premier",
      "among the top", "tier-1", "highest ranked".
    check_against: "rankings (section 3)"
    violation_if: >
      No verified rank is recorded for that institute, OR the claim is better
      than the recorded rank, OR the recorded rank is older than
      ranking_staleness_months. A rep may not make a standing claim the company
      cannot substantiate.
    not_this_rule: >
      A precise but wrong figure ("ranked 12th" when it is 18th) is the lesser
      item "Rankings stated correctly". Tier inflation and a numeric slip are
      not the same violation.
    never_fail_both_with: "Rankings stated correctly"
    fails_checklist_item: "No unsubstantiated ranking or tier claim"
    example_violation: "IIM Ranchi is in the top 10 IIMs in the country."
    example_ok: "IIM Ranchi is ranked 18th in NIRF Management 2024."

  - id: credential_equivalence
    when_rep: >
      Says or AGREES that the credential is equal to, the same as, at par with,
      as good as, counts as, or is treated as another qualification. Watch for
      this arriving as an affirmation rather than a statement — see the
      affirmation rule in section 5.
    check_against: "credential.never_equivalent_to (section 4)"
    violation_if: "Any equivalence to a listed qualification is asserted or affirmed."
    fails_checklist_item: "No credential equivalence or recognition claimed"
    example_violation: 'CUSTOMER: "is it equal to a PGDCA?" REP: "Yeah."'
    example_ok: "This is a Post Graduate Certificate Programme, not a degree."

  - id: credential_recognition
    when_rep: >
      Claims the credential is approved, recognised or accredited by a body, or
      that it unlocks an outcome reserved for degrees.
    check_against: "credential.never_recognised_by and credential.never_unlocks (section 4)"
    violation_if: "Any listed body or outcome is claimed."
    fails_checklist_item: "No credential equivalence or recognition claimed"
    example_violation: "It is UGC approved so it is valid for government jobs."
    example_ok: "It is an industry-recognised certificate from the institute."

