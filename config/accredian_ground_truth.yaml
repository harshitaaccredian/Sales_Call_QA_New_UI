# =============================================================================
# ACCREDIAN GROUND TRUTH
# =============================================================================
# Facts that are true on EVERY call, whatever program is being sold.
#
# WHY IT EXISTS
# The analyser can only flag a statement it can contradict. Its only source of
# truth used to be the course CSV for the one program on the call, which made a
# whole class of violation invisible:
#
#   "IIM Ranchi is in the top 10 IIMs"
#       the CSV has no rankings -> nothing to contradict
#   "For the CFO program we have IIM Calcutta"
#       the CSV describes ONE program and never lists who we DON'T work with
#   "Is it equal to a PGDCA?"  "Yeah."
#       the CSV says what the credential IS, never what it is NOT
#
# This file supplies those missing facts, and the rules for using them.
#
# -----------------------------------------------------------------------------
# HOW TO EXTEND THIS FILE  (read this before adding anything)
# -----------------------------------------------------------------------------
# Everything is in two layers:
#
#   FACTS   sections 1-4. Lists and values. What is true.
#   RULES   sections 5-6. What to look for, what to compare it against, and
#           which checklist item fails. The analyser applies every rule here.
#
# TO ADD A NEW CHECK, add one block to `claim_rules`. You do not touch the
# prompt and you do not touch any code. Copy an existing block and fill in:
#
#   - id:                    short slug, unique
#     when_rep:              what the rep does, in plain language
#     check_against:         which facts section settles it
#     violation_if:          the test that makes it a FAIL
#     fails_checklist_item:  must match a checklist item EXACTLY
#     example_violation:     one real line from a call
#     example_ok:            one line that must NOT be flagged
#
# `fails_checklist_item` is the one field you cannot get wrong. Incidents are
# built from checklist FAILs, so a rule pointing at an item that does not exist
# produces nothing. If your new rule needs a checklist item that is not in
# analysis_prompt.md yet, add the item there too and give it a severity in
# incident_severity_map.yaml. Those are the only three files involved.
#
# TO CHANGE SEVERITY, edit incident_severity_map.yaml, not this file. Severity
# is policy and lives in one table.
#
# TO ADD A FACT ONLY (a new partner, a new ranking), just add it to the list in
# sections 1-4. The existing rules pick it up immediately.
# =============================================================================

last_reviewed: "2026-10-06"
partner_list_verified: true


# =============================================================================
# 1. COMPANY IDENTITY
# =============================================================================
company:
  legal_seller: "Accredian"
  what_reps_are: "Accredian employees selling a program delivered with a partner institute"
  what_reps_are_not:
    - "employees, staff, faculty or program managers of any partner institute"
    - "calling 'from' IIM, IIT, XLRI or any institute"
  intro_must_include:
    - "the name Accredian"
    - "the full and correct partner institute name"


# =============================================================================
# 2. PARTNER INSTITUTES  (closed world)
